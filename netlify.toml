# ============================================================================
# Netlify configuration
# ----------------------------------------------------------------------------
# The build command matters more than it looks. It means anyone can edit
# content.js straight on GitHub and the deploy rebuilds index.html for them.
# Nobody has to remember to run the build by hand.
# ============================================================================

[build]
  command = "node build.js"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Sensible defaults for a public site. None of these change how it looks.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Fonts and photographs never change without changing filename, so they can be
# cached hard. The HTML must not be, or edits would not show up.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/people/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
